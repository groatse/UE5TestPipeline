# Default analyzer thresholds. Copy this file and pass it with --thresholds to tune.

# Frame budget in ms. A profile's budget_ms or --budget-ms overrides it.
budget_ms = 11.1

[playable]
# The game counts as playable from the first frame that starts a window this
# long with no more than this share of frames over budget and no frame over
# max_frame_ratio times the budget. Frames before it (after the map loads) are
# "warmup": shown, but kept out of baselines and gains.
window_s = 2.0
max_share_over = 0.01
max_frame_ratio = 1.5

[bound]
# An over-budget frame is "mixed" when the second-largest of game, render,
# RHI and GPU time is within this fraction of the largest.
mixed_within = 0.10

[overrun]
# A sustained overrun spans at least this many frames from its first to its
# last over-budget frame...
min_frames = 45
# ...with no more than this many in-budget frames in a row inside it.
max_gap_frames = 5

[hitch]
# A hitch frame takes more than this multiple of the rolling median frame time.
factor = 2.0
# The rolling median covers this many previous frames.
window_frames = 90
# It needs at least this many previous frames before hitches are judged.
min_window_frames = 10
# A hitch is at most this many consecutive hitch frames; longer runs are left
# to overrun detection.
max_frames = 3
# Only frames over budget count as hitch frames, so small relative spikes at
# low frame times are ignored.
require_over_budget = true

[causes]
# How many causes to keep per hitch or overrun.
top = 5
# In-budget frames sampled across the run as the baseline for each timer.
baseline_frames = 30
# Upper limit on over-budget frames read from the trace; beyond it they are
# sampled evenly and the gains are scaled up to the full count.
max_frames = 150
# Frames this early in the capture are not used as baseline (startup).
skip_start_s = 2.0
# Rises smaller than this are ignored.
min_rise_ms = 0.05
# Timers that measure waiting rather than work. They show where a thread
# stalled, not what to optimize, so they are never named as causes.
ignore = [
  "*Wait*",
  "*wait*",
  "*Idle*",
  "*idle*",
  "*Present*",
  "*Sleep*",
  "Oversubscription",
  "*LookingForWork*",
]
# Framework scopes every frame passes through. They are dropped from the
# caller chain shown under a hot spot, because they say nothing about why it
# rose; the chain keeps only the scopes that place the hot spot in game or
# engine systems.
trim = [
  "FEngineLoop::Tick",
  "Frame",
  "FrameTime",
  "Tick_Engine",
  "GameEngine Tick",
  "UWorld_Tick",
  "World Tick Time",
  "GT Tickable Time",
  "FTimerManager",
  "Tick Time",
  "TG_*",
  "ReleaseTickGroup Block",
  "TickCompletionEvents",
  "ProcessUntilTasksComplete",
  "FTickFunctionTask",
  "Slate::Tick (Time and Widgets)",
  "Total Slate Tick Time",
  "Blueprint Time",
  "BeginFrame",
  "SceneRenderBuilder_*",
  "SceneRender",
  "RenderViewFamily",
  "FDeferredShadingSceneRenderer_Render",
  "Scene",
  "RenderGraphExecute",
  "ExecuteForegroundTask",
  "ExecuteBackgroundTask",
  "RHITaskPipe",
  "RHI_Translate",
]
# The full call tree is shown only when the hot spots explain less than this
# share of a hitch's stall, i.e. when the time is spread over many scopes and
# no single one is the answer.
tree_below_share = 0.5

# Engine systems that run work queued earlier in the frame, and the scopes that
# queue it. A hot spot under one of these scopes names the Blueprint or object
# above a matching scope elsewhere in the same frame as "requested by".
[causes.requesters]
"Runner Flush" = ["Widget::PlayAnimation*", "UUMGSequencePlayer*", "*PlaySequence*"]
"Slate::Prepass" = ["*SetText*", "*SetVisibility*", "*AddChild*", "*CreateWidget*"]