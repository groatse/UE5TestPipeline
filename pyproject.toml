[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ueperf"
version = "0.1.0"
description = "Automated performance playtests for UE5 projects"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ueperf = "ueperf.cli:main"

[tool.setuptools.packages.find]
include = ["ueperf*"]

[tool.setuptools.package-data]
ueperf = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
